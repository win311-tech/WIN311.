services:
  - type: web
    name: win311-prog2
    env: python
    buildCommand: "python -m pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && gunicorn win311.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: win311-t3xb.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://win311-t3xb.onrender.com
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SMTP_USE_TLS
        value: "true"
      - key: BREVO_SMTP_USE_SSL
        value: "false"
      - key: EMAIL_TIMEOUT
        value: "10"
