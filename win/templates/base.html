{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage | WIN311</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/about.css' %}">
    <link rel="stylesheet" href="{% static 'css/update.css' %}">
</head>
<body>
    <!-- Hamburger Icon -->
    <span class="hamburger" onclick="toggleNav()">&#9776;</span>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" onclick="closeNav()"></div>

    <!-- Hamburger Menu Container -->
    <div class="side-menu" id="navbar">
        <ul class="sidenav">
            <li><a class="active" href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'update' %}">Update Information</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
        </ul>
    </div>

    {% block content %}{% endblock %}

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
